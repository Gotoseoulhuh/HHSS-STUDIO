<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B100E" />
    <title>HHSS Filmography</title>
    <!--
      공유 미리보기(카카오톡·메신저·SNS). 제목·소개글·썸네일을 바꾸려면 아래 값과 public/og-image.jpg만 고치면 된다.
      썸네일은 1200×630 이상 권장, 주소는 반드시 https:// 로 시작하는 전체 주소.
    -->
    <meta name="description" content="연출 허상경 · 제작 내포스튜디오. 〈크게 소리치며〉 〈TAKE YOUR MARK〉 〈그 여름에 머무는 너에게〉 〈우리가 찾고 있던 별〉" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HHSS" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://hhss.studio/" />
    <meta property="og:title" content="HHSS Filmography" />
    <meta property="og:description" content="연출 허상경 · 제작 내포스튜디오. 학생들과 함께 만든 단편영화와 뮤직비디오." />
    <meta property="og:image" content="https://hhss.studio/og-image.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="〈크게 소리치며〉 대숲에서 서로의 손을 붙잡은 세 낭자" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/Paperlogy-7Bold.ttf" as="font" type="font/ttf" crossorigin />
    <!-- 공개 전 가림막 기간에는 검색 노출 막기. 공개할 때 이 줄을 지우고 src/lib/gate.ts의 GATE_ENABLED를 false로 -->
    <meta name="robots" content="noindex, nofollow" />
    <!--
      JS 번들보다 먼저 첫 화면을 정한다.
      1) 비밀번호를 아직 안 넣었으면 → 검은 가림막(is-gated). 인트로는 통과 후에 (src/components/Gate.tsx)
      2) 통과했고 이번 탭에서 인트로를 안 봤으면 → 흰 배경을 먼저 깔아 번쩍임 방지(is-intro). 재생은 src/components/Intro.tsx
      '움직임 줄이기' 설정이면 인트로 생략. 키 이름은 src/lib/gate.ts의 GATE_KEY와 같아야 함.
    -->
    <script>
      try {
        var root = document.documentElement
        if (!localStorage.getItem('hhss-gate-v1')) root.classList.add('is-gated')
        else if (!sessionStorage.getItem('hhss-intro-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches)
          root.classList.add('is-intro')
      } catch (e) {}
    </script>
    <style>html.is-intro, html.is-intro body { background: #FDFBFB; } /* = --intro-bg */</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;color:#B8C4D1;background:#0B100E">이 사이트는 자바스크립트가 필요합니다.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
