<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B100E" />
    <title>HHSS Filmography</title>
    <!--
      공유 미리보기(카카오톡·메신저·SNS). 제목·소개글·썸네일을 바꾸려면 아래 값과 public/og-image.jpg만 고치면 된다.
      썸네일은 1200×630 이상 권장, 주소는 반드시 https:// 로 시작하는 전체 주소.
    -->
    <meta name="description" content="연출 허상경 · 제작 내포스튜디오. 〈크게 소리치며〉 〈TAKE YOUR MARK〉 〈그 여름에 머무는 너에게〉 〈우리가 찾고 있던 별〉" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HHSS" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://hhss.studio/" />
    <meta property="og:title" content="HHSS Filmography" />
    <meta property="og:description" content="연출 허상경 · 제작 내포스튜디오. 학생들과 함께 만든 단편영화와 뮤직비디오." />
    <meta property="og:image" content="https://hhss.studio/og-image.jpg" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:image:alt" content="〈크게 소리치며〉 대숲에서 서로의 손을 붙잡은 세 낭자" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="/fonts/Paperlogy-7Bold.ttf" as="font" type="font/ttf" crossorigin />
    <!--
      인트로(흰 화면 + 캐릭터 영상): JS 번들보다 먼저 판단해 첫 화면부터 흰 배경을 깔아 어두운 화면이 번쩍이지 않게 한다.
      탭(세션)당 1회, '움직임 줄이기' 설정이면 생략. 실제 재생·사라짐은 src/components/Intro.tsx
    -->
    <script>
      try {
        if (!sessionStorage.getItem('hhss-intro-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.add('is-intro')
      } catch (e) {}
    </script>
    <style>html.is-intro, html.is-intro body { background: #FDFBFB; } /* = --intro-bg */</style>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;color:#B8C4D1;background:#0B100E">이 사이트는 자바스크립트가 필요합니다.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
