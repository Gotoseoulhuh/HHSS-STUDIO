name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 매일 03:00 KST — 미리 렌더링 갱신 + Supabase 활동 유지(연결 후)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Pages 설정에서 배포 경로를 받음: 도메인 연결 전 '/HHSS-STUDIO', 연결 후 '' (재배포만 하면 자동 전환)
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # 무료 Supabase 프로젝트는 요청이 오래 없으면 일시 정지됨 → 매일 예약 빌드 때 한 번 읽어 활동 유지
      # 연결 값은 .env.production(공개용 URL·publishable 키)에서 읽음
      - name: Supabase 활동 유지
        run: |
          set -a; . ./.env.production; set +a
          if [ -z "$VITE_SUPABASE_URL" ]; then echo '연결 값 없음 — 건너뜀'; exit 0; fi
          curl -fsS -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/visit_stats" -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}' > /dev/null || echo "::warning::Supabase 응답 없음 — 대시보드에서 프로젝트 상태를 확인하세요"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
